model:
  base_learning_rate: 4.5e-6
  target: ldm.models.mri_vae.MRIVAE
  params:
    monitor: "val/rec_loss"
    embed_dim: 4
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 50001
        kl_weight: 0.000001
        disc_weight: 0.5
        disc_in_channels: 1

    ddconfig:
      double_z: True
      z_channels: 4
      resolution: 256
      in_channels: 1
      out_ch: 1
      ch: 128
      ch_mult: [ 1, 2, 4, 4 ]  # num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 0  # data is preloaded into RAM; workers only waste memory via fork
    wrap: True
    train:
      target: ldm.data.mri.MRIIXITrain
      params:
        data_root: data/IXI-T2-hd
        size: 256
        stage: stage2
    validation:
      target: ldm.data.mri.MRIIXIValidation
      params:
        data_root: data/IXI-T2-hd
        size: 256
        stage: stage2
    test:
      target: ldm.data.mri.MRITest
      params:
        data_root: data/IXI-T2-hd
        size: 256
        is_test: False
        stage: stage2

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    max_epochs: 800
    check_val_every_n_epoch: 5
    strategy: ddp_find_unused_parameters_true
