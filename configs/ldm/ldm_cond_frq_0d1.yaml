model:
  base_learning_rate: 2.0e-5
  target: ldm.models.diffusion.mri_ldm.MRILatentDiffusion
  params:
    ckpt_path: null
    linear_start: 0.0015
    linear_end: 0.0155
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    loss_type: l1
    first_stage_key: "image"
    cond_stage_key: "image"
    image_size: 32
    channels: 4
    scale_by_std: True
    monitor: 'val/loss_simple_ema'
    parameterization: 'x0'
    saved_path: null
    ddim: False
    ddim_steps: 200
    eta: 1.0

    cond_stage_trainable: False
    conditioning_key: concat
    cond_stage_config:
      target: fdp.module.FDPModule
      params:
        n_prior: 128
        mask_ratio: 0.10
        img_size: 256
        prior_path_real: preload/t2_hf_0d3_embed_128ac_real_frq.pth
        prior_path_imag: preload/t2_hf_0d3_embed_128ac_imag_frq.pth
        ckpt_path: outputs/fdp_latest.pt

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 12
        out_channels: 4
        model_channels: 192
        attention_resolutions: [ 1, 2, 4, 8]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 2, 4, 4]
        num_heads: 8
        use_scale_shift_norm: True
        resblock_updown: True

    first_stage_config:
      target: ldm.models.mri_vae.MRIVAE
      params:
        ckpt_path: outputs/vae_latest.ckpt
        embed_dim: 4
        monitor: "val/rec_loss"
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 1
          out_ch: 1
          ch: 128
          ch_mult: [ 1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 0  # data is preloaded into RAM; workers only waste memory via fork
    wrap: False
    train:
      target: ldm.data.mri.MRIIXITrain
      params:
        data_root: data/IXI-T2-hd
        size: 256
        stage: stage2
    validation:
      target: ldm.data.mri.MRIIXIValidation
      params:
        data_root: data/IXI-T2-hd
        size: 256
        stage: stage2
    test:
      target: ldm.data.mri.MRITest
      params:
        data_root: data/IXI-T2-hd
        size: 256
        is_test: False
        stage: stage2

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 50000
        max_images: 8
        increase_log_steps: False

  trainer:
    benchmark: True
    max_epochs: 800
    check_val_every_n_epoch: 5
